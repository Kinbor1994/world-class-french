<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="frenchBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CB0F6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="frenchWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="frenchRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <g transform="translate(96, 120)" filter="url(#shadow)">
    <path d="M 0,220 C 50,210 110,230 160,240 L 160,20 C 110,10 50,0 0,10 Z" fill="url(#frenchBlue)" />
    <path d="M 155,20 C 160,20 160,240 155,240 L 165,240 C 170,240 170,20 165,20 Z" fill="url(#frenchWhite)" />
    <path d="M 160,240 C 210,230 270,210 320,220 L 320,10 C 270,0 210,10 160,20 Z" fill="url(#frenchRed)" />
    
    <path d="M 160,-20 Q 200,60 165,180 L 160,195 L 155,180 Q 120,60 160,-20 Z" fill="url(#goldGrad)" stroke="#CA8A04" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="180" stroke="#713F12" stroke-width="2" opacity="0.6"/>
  </g>

  <g transform="translate(380, 80) scale(0.8)">
    <polygon points="25,0 32,15 49,18 37,30 40,47 25,39 9,47 13,30 1,18 17,15" fill="url(#goldGrad)" stroke="#EAB308" stroke-width="2"/>
  </g>

  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="3">WORLD-CLASS</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#58CC02" text-anchor="middle" letter-spacing="4">FRENCH</text>
</svg>
